name: Auto Decompile APK

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать репозиторий
        uses: actions/checkout@v4

      - name: Скачать APK из релиза
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --pattern "*.apk"

      - name: Установить JADX
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo skylot/jadx --pattern "jadx-*.zip"
          unzip -q jadx-*.zip -d jadx
          chmod +x jadx/bin/jadx

      - name: Декомпилировать APK
        env:
          JAVA_OPTS: "-Xmx12g"
        run: |
          for file in *.apk; do
            [ -e "$file" ] || continue
            ./jadx/bin/jadx -d "decompiled_${file%.apk}" "$file" || true
          done
          rm -f *.apk
          find decompiled_* -type f -size +95M -delete

      - name: Сохранить код в main
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add decompiled_*
          git commit -m "Декомпиляция APK" || exit 0
          git push
